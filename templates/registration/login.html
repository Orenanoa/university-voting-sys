{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Student Voting System</title>
  <link rel="icon" href="{% static 'images/logo.png' %}">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14532d; font-family: Georgia, 'Times New Roman', serif; }
    form { width: 100%; max-width: 340px; margin: 16px; padding: 32px 28px; background: cornsilk; border-radius: 6px; border-top: 6px solid #14532d; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
    form img { width: 110px; height: 110px; object-fit: contain; align-self: center; }
    h1 { margin: 0; font-size: 1.5rem; text-align: center; color: #14532d; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: bold; color: #333; }
    input { padding: 10px; font-size: 1rem; border: 1px solid #888; border-radius: 4px; }
    #error { margin: 0; min-height: 1.2em; color: #b00020; font-weight: bold; font-size: .95rem; }
    .note { margin: 0; padding: 8px 12px; background: #d1e7dd; color: #14532d; border-radius: 4px; font-weight: bold; }
    button { padding: 12px; font-size: 1rem; font-weight: bold; color: #fff; background: #14532d; border: 0; border-radius: 4px; cursor: pointer; }
    p.link { margin: 0; text-align: center; }
    a { color: #14532d; font-weight: bold; }
  </style>
</head>
<body>
  <form id="loginForm" method="post" novalidate>
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <img src="{% static 'images/logo.png' %}" alt="IUIU logo">
    <h1>Sign in to vote</h1>
    {% for message in messages %}<p class="note">{{ message }}</p>{% endfor %}

    <label>Username
      {{ form.username }}
    </label>
    <label>Password
      {{ form.password }}
    </label>

    <p id="error" role="alert">{% if form.errors %}Wrong username or password. Try again.{% endif %}</p>
    <button type="submit">Login</button>
    <p class="link">No account yet? <a href="{% url 'register' %}">Register</a></p>
  </form>

  <script>
    // Do not submit when the username or password is empty
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      var username = this.querySelector("[name=username]").value.trim();
      var password = this.querySelector("[name=password]").value.trim();
      if (username === "" || password === "") {
        e.preventDefault();
        document.getElementById("error").textContent = "Enter both your username and password.";
      }
    });
    var okMessages = [{% for message in messages %}{% if message.tags == 'success' %}"{{ message|escapejs }}",{% endif %}{% endfor %}];
    if (okMessages.length > 0) { alert(okMessages.join("\n")); }
  </script>
</body>
</html>
