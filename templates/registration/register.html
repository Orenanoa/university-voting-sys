{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Student Voting System</title>
  <link rel="icon" href="{% static 'images/logo.png' %}">
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #14532d; font-family: Georgia, 'Times New Roman', serif; }
    form { width: 100%; max-width: 340px; margin: 16px; padding: 32px 28px; background: cornsilk; border-radius: 6px; border-top: 6px solid #14532d; box-shadow: 0 8px 24px rgba(0,0,0,.3); display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; }
    form img { width: 110px; height: 110px; object-fit: contain; align-self: center; }
    h1 { margin: 0; font-size: 1.5rem; text-align: center; color: #14532d; }
    label { display: flex; flex-direction: column; gap: 6px; font-weight: bold; color: #333; }
    input { padding: 10px; font-size: 1rem; border: 1px solid #888; border-radius: 4px; }
    span.error { color: #b00020; font-weight: normal; font-size: .9rem; }
    #error { margin: 0; min-height: 1.2em; color: #b00020; font-weight: bold; font-size: .95rem; }
    button { padding: 12px; font-size: 1rem; font-weight: bold; color: #fff; background: #14532d; border: 0; border-radius: 4px; cursor: pointer; }
    p.link { margin: 0; text-align: center; }
    a { color: #14532d; font-weight: bold; }
  </style>
</head>
<body>
  <form id="registerForm" method="post" novalidate>
    {% csrf_token %}
    <img src="{% static 'images/logo.png' %}" alt="IUIU logo">
    <h1>Create an account</h1>
    {% for field in form %}
      <label>{{ field.label }}
        {{ field }}
        {% for error in field.errors %}<span class="error">{{ error }}</span>{% endfor %}
      </label>
    {% endfor %}
    <p id="error" role="alert"></p>
    <button type="submit">Register</button>
    <p class="link">Already registered? <a href="{% url 'login' %}">Login</a></p>
  </form>

  <script>
    // Do not submit when any field is empty
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      var fields = this.querySelectorAll("input:not([type=hidden])");
      for (var i = 0; i < fields.length; i++) {
        if (fields[i].value.trim() === "") {
          e.preventDefault();
          document.getElementById("error").textContent = "Fill in every field.";
          return;
        }
      }
    });
  </script>
</body>
</html>
