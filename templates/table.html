<div class="table-wrap">
  <table>
    <thead>
      <tr>
        {% for header in headers %}<th>{{ header }}</th>{% endfor %}
        {% if show_actions %}<th>Actions</th>{% endif %}
      </tr>
    </thead>
    <tbody id="record-list">
      {% for row in rows %}
        {% include 'table_row.html' %}
      {% empty %}
        <tr class="empty-row"><td colspan="{{ colspan }}">No records yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
