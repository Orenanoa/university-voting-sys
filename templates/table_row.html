<tr>
  {% for cell in row.cells %}<td>{{ cell }}</td>{% endfor %}
  {% if show_actions %}
    <td class="row-actions">
      {% for a in row.actions %}
        {% if a.post %}
          <form method="post" action="{{ a.url }}" class="inline">{% csrf_token %}
            <button type="submit" class="small {{ a.css }}">{{ a.label }}</button>
          </form>
        {% elif a.remove %}
          <a href="{{ a.url }}" class="btn small {{ a.css }} js-remove">{{ a.label }}</a>
        {% else %}
          <a href="{{ a.url }}" class="btn small {{ a.css }}">{{ a.label }}</a>
        {% endif %}
      {% endfor %}
    </td>
  {% endif %}
</tr>
