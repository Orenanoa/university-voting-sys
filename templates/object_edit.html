{% extends 'base.html' %}
{% block title %}Edit {{ page.title }}{% endblock %}
{% block content %}
  <h1>Edit {{ page.title }}</h1>
  <p class="lead">Change the details below and save.</p>
  <form id="f" class="data-form" method="post" novalidate>
    {% csrf_token %}
    {% include 'form_fields.html' %}
    <p id="msg" role="alert">{% for error in form.non_field_errors %}{{ error }} {% endfor %}</p>
    <div class="actions">
      <button type="submit" class="green">Save Changes</button>
      <a href="{% url name %}" class="btn grey">Cancel</a>
    </div>
  </form>
{% endblock %}
